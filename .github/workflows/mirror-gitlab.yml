name: Mirror to GitLab

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - chore/*
      - docs/*
      - test/*
      - issue-*

concurrency:
  group: mirror-gitlab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Push ${{ github.ref_name }} to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push branch to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: gitlab.com/jose.luque1/solarguard-ai.git
          BRANCH: ${{ github.ref_name }}
        run: git push --force "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}" "HEAD:refs/heads/${BRANCH}"
