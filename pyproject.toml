[project]
name = "solarguard-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "onnxruntime>=1.29.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "plotly>=7.0.0",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "ruff>=0.16.7",
]

[project.scripts]
solarguard-ai = "solarguard_ai:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
