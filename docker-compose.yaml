services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarguard-backend
    command: ["uv", "run", "python", "-m", "solarguard_ai.servidor_grpc", "--puerto", "50051"]
    ports:
      - "50051:50051"
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_ENABLED=true
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    depends_on:
      - mlflow
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarguard-frontend
    command: ["uv", "run", "streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_ENABLED=true
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    depends_on:
      - backend
      - mlflow
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarguard-mlflow
    command: ["uv", "run", "mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////data/mlflow.db", "--default-artifact-root", "/data/artifacts"]
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - mlflow_data:/data
    restart: unless-stopped

volumes:
  mlflow_data:
