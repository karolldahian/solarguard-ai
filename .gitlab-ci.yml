variables:
  UV_VERSION: "0.10.9"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "trixie-slim"
  IMAGEN_NAME: "jarvindav/solarguard-ai"
  IMAGE_TAG: "solarguard-1.0"
  UV_CACHE_DIR: ".uv-cache"
  DOCKER_BUILDKIT: 1

stages:
  - test
  - build
  - deploy

run_test:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends make libglib2.0-0 libgl1 libxcb1
    - rm -rf /var/lib/apt/lists/*
  script:
    - uv sync
    - make test
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .uv-cache/

build_image:
  stage: build
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  image: docker:29.3.0-cli
  services:
    - docker:29.3.0-dind
  before_script:
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin
  script:
    - docker pull $IMAGEN_NAME:latest || true
    - >
      docker build 
      --cache-from $IMAGEN_NAME:latest 
      --build-arg BUILDKIT_INLINE_CACHE=1 
      -t $IMAGEN_NAME:$IMAGE_TAG 
      -t $IMAGEN_NAME:latest 
      .
    - docker push $IMAGEN_NAME:$IMAGE_TAG
    - docker push $IMAGEN_NAME:latest

deploy:
  stage: deploy
  image: alpine:latest
  variables:
    DOCKER_CONTAINER: "solarguard_ai"
  before_script:
    - apk add --no-cache openssh-client
    - chmod 400 $SSH_KEY
  script:
    - >
      ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@64.23.148.174 "
      echo \"$REGISTRY_PASS\" | docker login -u \"$REGISTRY_USER\" --password-stdin &&
      docker pull $IMAGEN_NAME:$IMAGE_TAG &&
      docker rm -f $DOCKER_CONTAINER 2>/dev/null || true &&
      docker run -d --name $DOCKER_CONTAINER -p 5000:5000 $IMAGEN_NAME:$IMAGE_TAG &&
      docker image prune -f"