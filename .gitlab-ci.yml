# ------------------------------------------------------------------------------
# Pipeline CI espejo de GitHub Actions (.github/workflows/ci.yml)
# ------------------------------------------------------------------------------
stages:
  - quality
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.uv-base:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --dev

# ------------------------------------------------------------------------------
# Etapa 1: Calidad (Ruff lint + format + uv.lock)
# ------------------------------------------------------------------------------
lint-and-format:
  stage: quality
  extends: .uv-base
  needs: []
  script:
    - echo "=== Verificando integridad del archivo uv.lock ==="
    - uv lock --check
    - echo "=== Ejecutando linter Ruff ==="
    - uv run ruff check .
    - echo "=== Verificando formato de código con Ruff ==="
    - uv run ruff format --check .
# ------------------------------------------------------------------------------
# Etapa 2: Pruebas Unitarias y Cobertura (Pytest + Cobertura report)
# ------------------------------------------------------------------------------
unit-tests:
  stage: test
  extends: .uv-base
  needs: []
  script:
    - echo "=== Ejecutando suite de pruebas unitarias y análisis de cobertura ==="
    - uv run pytest -v --junitxml=junit-report.xml --cov --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?\%)/'
  artifacts:
    when: always
    reports:
      junit: junit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
# ------------------------------------------------------------------------------
# Etapa 3: Verificación de Construcción y Empaquetado
# ------------------------------------------------------------------------------
build-and-compile:
  stage: build
  extends: .uv-base
  needs:
    - lint-and-format
    - unit-tests
  script:
    - echo "=== Compilando sintaxis de módulos Python ==="
    - uv run python -m compileall src scripts
    - echo "=== Construyendo paquete distribuible (wheel & sdist) con UV ==="
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
